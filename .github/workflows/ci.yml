name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: composer validate --strict --no-check-lock
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer verify
      - run: jq empty pam-native.plugin.json pam-native.idl.json
